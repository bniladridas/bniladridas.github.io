backend:
  name: github
  repo: bniladridas/bniladridas.github.io
  branch: main
  base_url: https://decap-proxy.harpertoken-welcome.workers.dev
  auth_endpoint: auth

# GitHub authentication uses the standalone Cloudflare Worker OAuth proxy.
# OAuth secrets are stored only as Cloudflare Worker secrets, never in this repository.

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "content/about.json"
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Body, name: body, widget: text}
          - {label: Rule, name: rule, widget: string}
