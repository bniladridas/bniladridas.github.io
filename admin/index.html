<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — About</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body{max-width:680px;margin:0 auto;padding:2rem 1.25rem}
  label{display:block;margin:1rem 0 .35rem;font-weight:600}
  input,textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;background:#0c1322;color:var(--txt);font:inherit}
  textarea{min-height:120px;resize:vertical}
  .row{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
  .hint{color:var(--mut);font-size:.85rem}
  #status{margin-top:1rem;font-size:.9rem}
</style>
</head>
<body>
<h1>Admin — Edit About</h1>
<p class="hint">Admin only. Enter a GitHub fine-grained token with <code>contents:write</code> for <code>bniladridas/bniladridas.github.io</code> only. Token stays in your browser and is sent only to GitHub. For a more secure setup, use Decap CMS with OAuth — see <code>admin/config.yml</code> comments.</p>
<label for="token">GitHub token (fine-grained, repo contents:write)</label>
<input id="token" type="password" placeholder="github_pat_..." autocomplete="off" />
<label for="title">Title</label>
<input id="title" type="text" />
<label for="body">Body</label>
<textarea id="body" rows="4"></textarea>
<label for="rule">Rule</label>
<input id="rule" type="text" />
<div class="row">
  <button id="load" class="btn ghost">Load current</button>
  <button id="save" class="btn primary">Save to GitHub</button>
  <a href="../" class="btn ghost">Back to site</a>
</div>
<p id="status" class="hint"></p>
<script>
const repo = "bniladridas/bniladridas.github.io";
const branch = "main";
const path = "content/about.json";
const els = {
  token: document.getElementById('token'),
  title: document.getElementById('title'),
  body: document.getElementById('body'),
  rule: document.getElementById('rule'),
  status: document.getElementById('status'),
};
try { const s=localStorage.getItem('about-token'); if(s) els.token.value=s; } catch{}
function setStatus(m,ok){ els.status.textContent=m; els.status.style.color=ok?'var(--acc)':'var(--mut)'; }
async function load(){
  setStatus('Loading…');
  try{
    const r=await fetch('../content/about.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    els.title.value=d.title||''; els.body.value=d.body||''; els.rule.value=d.rule||'';
    setStatus('Loaded from content/about.json',true);
  }catch(e){ setStatus('Load failed: '+e.message); }
}
async function save(){
  const token=els.token.value.trim();
  if(!token){ setStatus('Enter a GitHub token'); return; }
  try{ localStorage.setItem('about-token',token); }catch{}
  const content={title:els.title.value.trim(),body:els.body.value.trim(),rule:els.rule.value.trim()};
  if(!content.title||!content.body){ setStatus('Title and body required'); return; }
  setStatus('Saving…');
  try{
    const getRes=await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'}});
    let sha=null;
    if(getRes.ok){ const j=await getRes.json(); sha=j.sha; }
    else if(getRes.status!==404){ throw new Error(`GET ${getRes.status}: ${(await getRes.text()).slice(0,120)}`); }
    const body={message:`Update About via admin`,content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)+"\n"))),branch,...(sha?{sha}:{})};
    const putRes=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!putRes.ok) throw new Error(`PUT ${putRes.status}: ${(await putRes.text()).slice(0,200)}`);
    setStatus('Saved to GitHub at '+path+' (commit on '+branch+')',true);
  }catch(e){ setStatus('Save failed: '+e.message); }
}
document.getElementById('load').addEventListener('click',load);
document.getElementById('save').addEventListener('click',save);
load();
</script>
</body>
</html>
