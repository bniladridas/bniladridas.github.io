[project]
name = "bniladridas-portfolio"
version = "0.2.0"
description = "Portfolio server for bniladridas: Traction and Palmshed Sandbox."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "bniladridas"}]
keywords = ["portfolio", "traction", "palmshed", "sandbox"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
portfolio = "bniladridas_portfolio.cli:main"

[project.urls]
Homepage = "https://bniladridas.github.io/"
Repository = "https://github.com/bniladridas/bniladridas.github.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bniladridas_portfolio"]

[tool.hatch.build.targets.wheel.force-include]
"index.html" = "bniladridas_portfolio/static/index.html"
"styles.css" = "bniladridas_portfolio/static/styles.css"
"script.js" = "bniladridas_portfolio/static/script.js"
"favicon.svg" = "bniladridas_portfolio/static/favicon.svg"
"favicon.png" = "bniladridas_portfolio/static/favicon.png"
"apple-touch-icon.png" = "bniladridas_portfolio/static/apple-touch-icon.png"
"og-image.png" = "bniladridas_portfolio/static/og-image.png"
"assets" = "bniladridas_portfolio/static/assets"
"content" = "bniladridas_portfolio/static/content"
"admin" = "bniladridas_portfolio/static/admin"
".github/assets/thumbnail.png" = "bniladridas_portfolio/static/.github/assets/thumbnail.png"
